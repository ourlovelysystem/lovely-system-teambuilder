<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Five Pointers at Snake Mountain</title>
  <link rel="stylesheet" href="background.css">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#050608;color:#f4f4f4}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    button,a{font:inherit}
    #chooser{height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#243226,#080a0c 55%,#020303)}
    .panel{width:min(680px,100%);padding:28px;border:1px solid #465047;background:#090c0ddd;box-shadow:0 24px 80px #000;text-align:center}
    h1{margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(25px,5vw,48px)}
    .sub{margin:0 0 25px;color:#aeb7b0}
    .roles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
    .role,.display-link{display:grid;place-items:center;min-height:68px;border:1px solid currentColor;color:var(--c,#d8dfd9);text-decoration:none;background:#070909}
    .display-link{margin-top:18px;color:#d7ddd8;text-transform:uppercase;letter-spacing:.12em}
    #stage{position:fixed;inset:0;display:none;background-color:#050608;background-position:center;background-size:cover;background-repeat:no-repeat}
    #paint{position:absolute;inset:0;width:100%;height:100%}
    #cursors{position:absolute;inset:0;pointer-events:none}
    .cursor{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border:3px solid var(--c);border-radius:50%;box-shadow:0 0 8px #000,0 0 18px var(--c);transform:translate(-100px,-100px)}
    .cursor:before,.cursor:after{content:"";position:absolute;background:var(--c)}
    .cursor:before{left:13px;top:-10px;width:2px;height:46px}.cursor:after{left:-10px;top:13px;width:46px;height:2px}
    #hud{position:absolute;left:16px;top:16px;display:flex;gap:10px;align-items:center;padding:9px 12px;background:#050708cc;border:1px solid #39413b;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
    #clear{position:absolute;right:16px;bottom:16px;padding:13px 18px;border:1px solid #d8dfd9;background:#090c0ddd;color:#fff;text-transform:uppercase;letter-spacing:.1em;cursor:pointer}
    #controller{position:fixed;inset:0;z-index:5;display:none;touch-action:none;user-select:none;cursor:crosshair}
    #controller .label{position:absolute;right:16px;top:16px;pointer-events:none;text-align:right}
    #controller .disc{display:inline-grid;place-items:center;padding:10px 14px;border:2px solid var(--c);background:#050708cc;box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    #controller .hint{margin-top:7px;color:#e0e5e1;text-shadow:0 1px 4px #000;text-transform:uppercase;letter-spacing:.08em;font-size:10px}
    #controller .dot{position:absolute;width:30px;height:30px;margin:-15px;border:3px solid var(--c);border-radius:50%;pointer-events:none;box-shadow:0 0 20px var(--c)}
    @media(max-width:620px){.roles{grid-template-columns:repeat(2,1fr)}.roles a:last-child{grid-column:1/-1}.panel{padding:20px}}
  </style>
</head>
<body>
  <main id="chooser">
    <section class="panel">
      <h1>Five Pointers at Snake Mountain</h1>
      <p class="sub">Choose the common display or one pointing device.</p>
      <div class="roles">
        <a class="role" style="--c:#ffcf24" href="?pointer=one">ONE</a>
        <a class="role" style="--c:#42c7ff" href="?pointer=two">TWO</a>
        <a class="role" style="--c:#ff5b61" href="?pointer=three">THREE</a>
        <a class="role" style="--c:#67e56c" href="?pointer=four">FOUR</a>
        <a class="role" style="--c:#cf70ff" href="?pointer=five">FIVE</a>
      </div>
      <a class="display-link" href="?display=1">Open common display</a>
    </section>
  </main>

  <main id="stage" aria-label="Common painting display">
    <canvas id="paint"></canvas>
    <div id="cursors"></div>
    <div id="hud"><span id="connection">connecting</span><span>•</span><span>five pointers</span></div>
    <button id="clear" type="button">Clear paint</button>
  </main>

  <main id="controller">
    <div class="label"><div class="disc" id="pointerName"></div><div class="hint">Move to articulate. Press and move to paint.</div></div>
    <div class="dot" id="localDot"></div>
  </main>

  <script src="config.js"></script>
  <script>
  (() => {
    const COLORS={one:'#ffcf24',two:'#42c7ff',three:'#ff5b61',four:'#67e56c',five:'#cf70ff'};
    const params=new URLSearchParams(location.search);
    const pointerId=params.get('pointer');
    const display=params.has('display');
    if(!display && !COLORS[pointerId]) return;

    const chooser=document.querySelector('#chooser');
    const stage=document.querySelector('#stage');
    const controller=document.querySelector('#controller');
    const status=document.querySelector('#connection');
    chooser.style.display='none';

    const canvas=document.querySelector('#paint');
    const ctx=canvas.getContext('2d');
    const cursors={};
    const previous={};
    const remoteQueues={};
    const remoteClocks={};
    const seenEvents=new Set();
    const REMOTE_BUFFER_MS=45;

    function resize(){
      const copy=document.createElement('canvas');
      copy.width=canvas.width;copy.height=canvas.height;
      copy.getContext('2d').drawImage(canvas,0,0);
      const dpr=Math.min(devicePixelRatio||1,2);
      canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);
      canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      if(copy.width)ctx.drawImage(copy,0,0,copy.width,copy.height,0,0,innerWidth,innerHeight);
    }

    function cursorFor(id){
      if(cursors[id])return cursors[id];
      const node=document.createElement('div');
      node.className='cursor';node.style.setProperty('--c',COLORS[id]);
      document.querySelector('#cursors').append(node);cursors[id]=node;return node;
    }

    function rememberEvent(eventId){
      if(!eventId)return true;
      if(seenEvents.has(eventId))return false;
      seenEvents.add(eventId);
      if(seenEvents.size>4000){const oldest=seenEvents.values().next().value;seenEvents.delete(oldest)}
      return true;
    }

    function showPointer(p,local=false){
      if(!COLORS[p.id])return;
      const x=p.x*innerWidth,y=p.y*innerHeight;
      const cursor=cursorFor(p.id);
      cursor.style.transition='none';
      cursor.style.transform=`translate(${x}px,${y}px)`;
      const old=previous[p.id];
      ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=COLORS[p.id];ctx.fillStyle=COLORS[p.id];ctx.lineWidth=7;
      if(p.painting){
        if(old&&old.painting){ctx.beginPath();ctx.moveTo(old.x*innerWidth,old.y*innerHeight);ctx.lineTo(x,y);ctx.stroke()}
        else{ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill()}
      }
      previous[p.id]=p;
    }

    let remoteFrame=0;
    function pumpRemote(){
      remoteFrame=0;
      const now=performance.now();
      let pending=false;
      Object.entries(remoteQueues).forEach(([id,queue])=>{
        const clock=remoteClocks[id];
        while(queue.length&&queue[0].clientTime+clock.offset<=now){
          const sample=queue.shift();
          if(sample.sequence<=clock.renderedSequence)continue;
          showPointer(sample);
          clock.renderedSequence=sample.sequence;
        }
        if(queue.length)pending=true;
      });
      if(pending)remoteFrame=requestAnimationFrame(pumpRemote);
    }

    function enqueueRemote(id,eventId,samples,batched=false){
      if(!COLORS[id]||!rememberEvent(eventId)||!samples.length)return;
      const now=performance.now();
      const last=samples[samples.length-1];
      const candidateOffset=now+REMOTE_BUFFER_MS-last.clientTime;
      const source=batched?eventId.slice(0,eventId.lastIndexOf(':')):null;
      if(batched&&remoteClocks[id]?.source!==source){remoteQueues[id]=[];delete remoteClocks[id]}
      const clock=remoteClocks[id]||(remoteClocks[id]={offset:candidateOffset,renderedSequence:-1,source});
      clock.offset=Math.min(clock.offset,candidateOffset);
      const queue=remoteQueues[id]||(remoteQueues[id]=[]);
      samples.forEach(sample=>{
        if(sample.sequence<=clock.renderedSequence||queue.some(queued=>queued.sequence===sample.sequence))return;
        queue.push({...sample,id});
      });
      queue.sort((a,b)=>a.sequence-b.sequence);
      if(!remoteFrame)remoteFrame=requestAnimationFrame(pumpRemote);
    }

    let socket;
    function connect(){
      socket=new WebSocket(window.SNAKE_MOUNTAIN_CONFIG.websocketUrl);
      socket.addEventListener('open',()=>{if(status)status.textContent='shared';socket.send(JSON.stringify({action:'join'}))});
      socket.addEventListener('message',event=>{
        const message=JSON.parse(event.data);
        if(message.type==='snapshot')batchSupported=message.capabilities?.pointerBatches===true;
        if(message.type==='pointer'){
          const p=message.pointer;
          enqueueRemote(p.id,p.eventId,[{x:p.x,y:p.y,painting:p.painting,sequence:legacySequence++,clientTime:performance.now()}]);
        }
        if(message.type==='pointer_batch')enqueueRemote(message.pointer.id,message.pointer.eventId,message.pointer.samples,true);
        if(message.type==='paint_cleared'){
          ctx.clearRect(0,0,innerWidth,innerHeight);
          Object.keys(previous).forEach(key=>delete previous[key]);
          Object.keys(remoteQueues).forEach(key=>delete remoteQueues[key]);
          Object.keys(remoteClocks).forEach(key=>delete remoteClocks[key]);
          seenEvents.clear();
        }
      });
      socket.addEventListener('close',()=>{if(status)status.textContent='reconnecting';setTimeout(connect,1200)});
    }
    function send(payload){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify(payload))}

    let batchSupported=false,legacySequence=0;
    stage.style.display='block';resize();addEventListener('resize',resize);
    if(display){
      document.querySelector('#clear').addEventListener('click',()=>send({action:'clearPaint'}));
    }else{
      document.querySelector('#clear').style.display='none';
      controller.style.display='block';controller.style.setProperty('--c',COLORS[pointerId]);
      document.querySelector('#pointerName').textContent=`Pointer ${pointerId}`;
      const dot=document.querySelector('#localDot');
      let painting=false,lastSent=0,flushTimer=0,counter=0,sequence=0,pendingSamples=[];
      const clientId=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));
      function flushSamples(){
        flushTimer=0;
        if(!pendingSamples.length)return;
        const samples=pendingSamples.splice(0,64);
        const eventId=`${clientId}:${++counter}`;
        if(batchSupported){
          rememberEvent(eventId);
          send({action:'pointer',pointer:{id:pointerId,eventId,samples}});
        }else samples.forEach(sample=>{
          const singleEventId=`${eventId}:${sample.sequence}`;
          rememberEvent(singleEventId);
          send({action:'pointer',pointer:{id:pointerId,eventId:singleEventId,x:sample.x,y:sample.y,painting:sample.painting}});
        });
        lastSent=performance.now();
        if(pendingSamples.length)flushTimer=setTimeout(flushSamples,0);
      }
      function capture(event,force=false){
        const rect=controller.getBoundingClientRect();
        const events=event.getCoalescedEvents?.()||[event];
        events.forEach(raw=>{
          const eventTime=Math.abs(raw.timeStamp-performance.now())<60000?raw.timeStamp:performance.now();
          const sample={x:Math.max(0,Math.min(1,(raw.clientX-rect.left)/rect.width)),y:Math.max(0,Math.min(1,(raw.clientY-rect.top)/rect.height)),painting,sequence:sequence++,clientTime:eventTime};
          pendingSamples.push(sample);
          showPointer({...sample,id:pointerId},true);
        });
        dot.style.transform=`translate(${event.clientX}px,${event.clientY}px)`;
        const now=performance.now();
        if(force||now-lastSent>30){flushSamples();return}
        if(!flushTimer)flushTimer=setTimeout(flushSamples,Math.max(0,30-(now-lastSent)));
      }
      controller.addEventListener('pointermove',event=>capture(event));
      controller.addEventListener('pointerdown',event=>{painting=true;controller.setPointerCapture(event.pointerId);capture(event,true)});
      controller.addEventListener('pointerup',event=>{painting=false;capture(event,true)});
      controller.addEventListener('pointercancel',event=>{painting=false;capture(event,true)});
    }
    connect();
  })();
  </script>
  <script src="https://progress.ourlovelysystem.org/lovely-system-alert.js"></script>
</body>
</html>
