<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teambuilder — Our Lovely System</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050607;color:#fff;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;overflow-x:hidden}
    .poster{position:relative;width:min(100vw,1024px);min-height:100vh;background:#000}
    .poster img{display:block;width:100%;height:auto;min-height:100vh;object-fit:cover;object-position:center top}
    .enter{position:absolute;left:4.5%;bottom:18%;width:43%;min-height:9%;display:flex;align-items:center;justify-content:center;padding:14px 18px;border:2px solid #f5c400;border-radius:8px;background:rgba(0,0,0,.18);color:transparent;text-decoration:none;outline-offset:5px}
    .enter:focus{outline:3px solid #fff;background:rgba(245,196,0,.12)}
    @media(max-width:700px){.poster{width:100vw}.poster img{min-height:auto}.enter{bottom:18.4%;width:44%;left:4.4%}}
  </style>
</head>
<body>
  <main class="poster">
    <img src="/assets/voltron-ghostbuster.jpg" alt="Teambuilder landing poster featuring a Ghostbuster-style pilot with a VOLTRON name tag and the message: When someone asks you to pilot a mighty robot lion juggernaut, you say Y-E-S-!">
    <a class="enter" href="/yellow/" aria-label="Enter Yellow Lion Onboarding Experience">Enter Yellow Lion Onboarding Experience</a>
  </main>
</body>
</html>
