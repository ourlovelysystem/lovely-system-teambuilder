<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yellow Lion Onboarding — Teambuilder</title>
  <style>
    :root{--gold:#f3bd27;--ink:#f7f3e7;--muted:#9b875f}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070604;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 20%,#4b2305 0,#1b0c03 35%,#070604 72%)}
    button{font:inherit}.app{height:100vh;display:grid;grid-template-rows:1fr auto}.stage{position:relative;overflow:hidden}.frame{position:absolute;inset:0;display:none}.frame.active{display:block}.frame.active.comic,.frame.active.warning{display:grid}
    .cockpit{position:absolute;inset:0;background:linear-gradient(180deg,#2b1306 0,#120905 64%,#080604 100%)}
    .eyes{position:absolute;inset:5vh 6vw 35vh;display:grid;grid-template-columns:1fr 1fr;gap:3vw;filter:drop-shadow(0 0 20px rgba(255,185,45,.15))}.eye{position:relative;overflow:hidden;border:5px solid #7a5518;background:linear-gradient(180deg,#cfaa66,#8e6c34);clip-path:polygon(8% 15%,92% 5%,100% 50%,88% 88%,12% 95%,0 52%)}.eye:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#d9b26c 0,#b3874b 22%,#93704a 50%,#644c35 78%,#3a3028 100%)}.eye:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 0 42%,rgba(0,0,0,.08) 55%,rgba(0,0,0,.45) 76%,rgba(0,0,0,.8) 100%);mix-blend-mode:multiply}.terrain{position:absolute;inset:38% 0 0;background:linear-gradient(180deg,transparent 0 3%,#9d7648 4% 40%,#5f482e 41% 100%);clip-path:polygon(0 50%,12% 38%,20% 55%,32% 30%,45% 58%,58% 35%,72% 54%,84% 32%,100% 46%,100% 100%,0 100%)}
    .console{position:absolute;left:0;right:0;bottom:0;height:40vh;background:linear-gradient(180deg,#1a1008,#090706);border-top:3px solid #8a4b10;box-shadow:0 -12px 30px rgba(0,0,0,.6)}.panel-grid{height:100%;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:1.2vw;padding:2.2vh 3vw}.bank{border:1px solid #633a12;background:#0f0c08;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}.lamp{height:24px;border-radius:3px;background:#3a2410;border:1px solid #7c4f1f;box-shadow:inset 0 0 8px #000}.lamp.on{background:#ff8d00;box-shadow:0 0 18px #ff8d00}.center{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #633a12;background:#0c0a07}.mode{color:var(--gold);font-weight:900;letter-spacing:.14em;font-size:clamp(16px,2vw,30px)}.sticks{position:absolute;left:0;right:0;bottom:5vh;display:flex;justify-content:space-between;padding:0 10vw;pointer-events:none}.stick{width:72px;height:150px;border-radius:24px 24px 18px 18px;background:linear-gradient(90deg,#17110c,#3b2515,#17110c);border:2px solid #6d421d}.caption{position:absolute;left:50%;top:7vh;transform:translateX(-50%);padding:10px 16px;border:1px solid rgba(243,189,39,.35);background:rgba(0,0,0,.55);color:var(--gold);font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .comic{place-items:center;background:radial-gradient(circle,#49300f,#100a04 70%)}.comic-card{width:min(980px,92vw);height:min(68vh,680px);border:10px solid #111;background:#d7a64d;box-shadow:0 18px 60px #000;position:relative;overflow:hidden}.sun{position:absolute;width:180px;height:180px;border-radius:50%;right:10%;top:10%;background:#f7d27a}.ground{position:absolute;left:0;right:0;bottom:0;height:34%;background:#6f4b24}.lion{position:absolute;left:50%;top:50%;width:440px;height:180px;transform:translate(-50%,-50%);background:#d6a719;border:8px solid #3c2b0f;border-radius:90px 110px 70px 80px;box-shadow:inset 0 0 0 18px #f0ca4b,0 14px 0 rgba(0,0,0,.18)}.lion:before{content:"";position:absolute;width:150px;height:120px;right:-75px;top:15px;background:#d6a719;border:8px solid #3c2b0f;border-radius:50% 45% 42% 55%}.lion:after{content:"";position:absolute;left:30px;right:25px;bottom:-65px;height:70px;background:linear-gradient(90deg,#d6a719 0 18%,transparent 18% 27%,#d6a719 27% 45%,transparent 45% 55%,#d6a719 55% 73%,transparent 73% 82%,#d6a719 82% 100%);border-bottom:8px solid #3c2b0f}.lion.snarl:before{box-shadow:inset -10px -30px 0 #111}.lion.roar{transform:translate(-50%,-50%) rotate(-5deg) scale(1.08)}.lion.fallen{transform:translate(-50%,-35%) rotate(17deg);top:58%}.roarfx{position:absolute;inset:0;background:repeating-radial-gradient(circle at 72% 50%,transparent 0 38px,rgba(255,244,160,.15) 40px 44px)}
    .warning{place-items:center;background:radial-gradient(circle at center,#3d0d08,#090504 70%)}.warning-box{width:min(780px,88vw);border:8px solid #4d170d;background:#120806;padding:28px;box-shadow:0 0 35px rgba(255,40,0,.35),inset 0 0 25px rgba(255,40,0,.12)}.warning-title{font-size:clamp(34px,6vw,76px);line-height:.95;color:#ff3b20;font-weight:900;text-align:center;text-shadow:0 0 18px #ff3b20;animation:blink 1s steps(1,end) infinite}.gauge{margin:38px auto 10px;width:min(520px,85%);height:130px;position:relative;border-radius:260px 260px 0 0;border:12px solid #684018;border-bottom:0;background:conic-gradient(from 270deg,#a81a12 0 18deg,#c79926 18deg 50deg,#4e8c39 50deg 90deg,transparent 90deg 360deg);overflow:hidden}.needle{position:absolute;width:46%;height:8px;background:#ff3b20;left:50%;bottom:0;transform-origin:left center;transform:rotate(193deg);box-shadow:0 0 10px #ff3b20}.gauge-label{display:flex;justify-content:space-between;color:#f5c96a;font-weight:800;letter-spacing:.08em}
    .controls{display:flex;gap:12px;justify-content:center;padding:18px;background:#090706;border-top:1px solid #4e3214}.controls button{border:2px solid var(--gold);background:#1a1208;color:var(--gold);padding:14px 20px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:8px}.controls button:hover,.controls button:focus{background:var(--gold);color:#1b1205}.small{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 12px;background:#090706}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.35}}
  </style>
</head>
<body>
<div class="app">
  <div class="stage">
    <section class="frame active" data-frame="0"><div class="cockpit"><div class="caption">Yellow Lion — Training Mode</div><div class="eyes"><div class="eye"><div class="terrain"></div></div><div class="eye"><div class="terrain"></div></div></div><div class="console"><div class="panel-grid"><div class="bank"><div class="lamp on"></div><div class="lamp"></div><div class="lamp on"></div></div><div class="center"><div class="mode">TRAINING MODE</div></div><div class="bank"><div class="lamp"></div><div class="lamp on"></div><div class="lamp"></div></div></div></div><div class="sticks"><div class="stick"></div><div class="stick"></div></div></div></section>
    <section class="frame comic" data-frame="1"><div class="comic-card"><div class="sun"></div><div class="ground"></div><div class="lion"></div></div></section>
    <section class="frame comic" data-frame="2"><div class="comic-card"><div class="sun"></div><div class="ground"></div><div class="lion"></div></div></section>
    <section class="frame comic" data-frame="3"><div class="comic-card"><div class="sun"></div><div class="ground"></div><div class="lion snarl"></div></div></section>
    <section class="frame comic" data-frame="4"><div class="comic-card"><div class="sun"></div><div class="ground"></div><div class="lion roar"></div><div class="roarfx"></div></div></section>
    <section class="frame comic" data-frame="5"><div class="comic-card"><div class="sun"></div><div class="ground"></div><div class="lion fallen"></div></div></section>
    <section class="frame warning" data-frame="6"><div class="warning-box"><div class="warning-title">HYDRAULIC FLUID</div><div class="gauge"><div class="needle"></div></div><div class="gauge-label"><span>RED / LOW</span><span>FULL</span></div></div></section>
  </div>
  <div><div class="controls"><button id="next">Begin</button><button id="restart" hidden>Restart Training</button></div><div class="small">Participant controls action. System controls sequence.</div></div>
</div>
<script>
const frames=[...document.querySelectorAll('.frame')];
const next=document.getElementById('next');
const restart=document.getElementById('restart');
const labels=['Begin','Sit','Stand','Bare Teeth','ROAR','What happened?'];
let state=0;
function render(){frames.forEach((f,i)=>f.classList.toggle('active',i===state));if(state<frames.length-1){next.hidden=false;restart.hidden=true;next.textContent=labels[state]||'Continue'}else{next.hidden=true;restart.hidden=false}}
next.addEventListener('click',()=>{if(state<frames.length-1){state++;render()}});
restart.addEventListener('click',()=>{state=0;render()});render();
</script>
</body>
</html>
