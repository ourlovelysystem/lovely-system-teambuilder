<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yellow Lion Onboarding — Teambuilder</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:1fr auto;background:#000}.stage{position:relative;min-height:0;background:#000}.frame{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000}.frame.active{display:flex}.frame img{display:block;width:100%;height:100%;object-fit:contain;background:#000}.controls{display:flex;justify-content:center;gap:12px;padding:14px;background:#070707;border-top:1px solid #292929}.controls button{min-width:180px;padding:13px 20px;border:1px solid #d8a927;border-radius:7px;background:#171207;color:#f3c94d;font:700 15px Arial,Helvetica,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.controls button:hover,.controls button:focus{background:#f3c94d;color:#171207}.small{text-align:center;padding:0 12px 11px;background:#070707;color:#8f8f8f;font-size:12px}@media(max-width:600px){.controls{padding:10px}.controls button{min-width:0;flex:1}}
  </style>
</head>
<body>
<div class="app">
  <main class="stage" aria-live="polite">
    <section class="frame active" data-frame="0"><img src="../assets/experiences/yellow-lion-onboarding/approved/01-parked.png" alt="Yellow Lion parked in its maintenance bay"></section>
    <section class="frame" data-frame="1"><img src="../assets/experiences/yellow-lion-onboarding/approved/02-cockpit-pilot-in.png" alt="View from inside the Yellow Lion cockpit in the maintenance hangar"></section>
    <section class="frame" data-frame="2"><img src="../assets/experiences/yellow-lion-onboarding/approved/03-sit.png" alt="Yellow Lion sitting"></section>
    <section class="frame" data-frame="3"><img src="../assets/experiences/yellow-lion-onboarding/approved/04-stand.png" alt="Yellow Lion standing"></section>
    <section class="frame" data-frame="4"><img src="../assets/experiences/yellow-lion-onboarding/approved/05-wind-up.png" alt="Yellow Lion winding up before its roar"></section>
    <section class="frame" data-frame="5"><img src="../assets/experiences/yellow-lion-onboarding/approved/06-roar.png" alt="Yellow Lion roaring with tremendous force"></section>
    <section class="frame" data-frame="6"><img src="../assets/experiences/yellow-lion-onboarding/approved/07-splat.png" alt="Yellow Lion collapsed on the ground as people react around it"></section>
    <section class="frame" data-frame="7"><img src="../assets/experiences/yellow-lion-onboarding/approved/08-hydraulic-failure.png" alt="Yellow Lion cockpit showing an empty hydraulic fluid gauge and warning light"></section>
  </main>
  <div>
    <div class="controls"><button id="next">Enter Cockpit</button><button id="restart" hidden>Restart Training</button></div>
    <div class="small">Participant controls action. System controls sequence.</div>
  </div>
</div>
<script>
const frames=[...document.querySelectorAll('.frame')];
const next=document.getElementById('next');
const restart=document.getElementById('restart');
const labels=['Enter Cockpit','Sit','Stand','Wind Up','ROAR','Continue','What happened?'];
let state=0;
function render(){
  frames.forEach((f,i)=>f.classList.toggle('active',i===state));
  if(state<frames.length-1){next.hidden=false;restart.hidden=true;next.textContent=labels[state]||'Continue'}
  else{next.hidden=true;restart.hidden=false}
}
next.addEventListener('click',()=>{if(state<frames.length-1){state++;render()}});
restart.addEventListener('click',()=>{state=0;render()});
render();
</script>
</body>
</html>
