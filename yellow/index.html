<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yellow Lion Onboarding — Teambuilder</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:1fr auto;background:#000}.stage{position:relative;min-height:0;background:#000}.frame{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000}.frame.active{display:flex}.frame img{display:block;width:100%;height:100%;object-fit:contain;background:#000}.controls{display:flex;justify-content:center;gap:12px;padding:14px;background:#070707;border-top:1px solid #292929}.controls button{min-width:180px;padding:13px 20px;border:1px solid #d8a927;border-radius:7px;background:#171207;color:#f3c94d;font:700 15px Arial,Helvetica,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.controls button:hover,.controls button:focus{background:#f3c94d;color:#171207}.controls button.retreat{border-color:#555;background:#161616;color:#666}.controls button.retreat:hover,.controls button.retreat:focus{background:#202020;color:#888}.small{text-align:center;padding:0 12px 11px;background:#070707;color:#8f8f8f;font-size:12px}.question{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);font-size:min(28vw,220px);font-weight:700;color:#fff;z-index:5;cursor:pointer}.question.show{display:flex}
    .arcade{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,#202020 0,#080808 56%,#000 100%);padding:30px 20px 120px}.arcade.active{display:flex}.arcade h1{margin:0 0 16px;color:#f3c94d;font-size:clamp(34px,6vw,74px);text-align:center;letter-spacing:.04em;text-transform:uppercase}.timer{font:900 clamp(52px,10vw,120px)/1 monospace;color:#ff3b30;margin:4px 0 18px;text-shadow:0 0 18px rgba(255,59,48,.5)}.token-message{min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:clamp(18px,2.4vw,30px);font-weight:700}.coins{position:absolute;left:0;right:0;bottom:20px;display:flex;align-items:end;justify-content:center;gap:clamp(10px,2vw,30px);padding:0 18px}.coin{border:2px solid #aaa;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e5e5e5,#9a9a9a 55%,#4c4c4c);color:#111;box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 8px 18px rgba(0,0,0,.55);font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1}.coin:hover,.coin:focus{outline:3px solid #f3c94d;transform:translateY(-3px)}.penny{width:52px;height:52px;background:radial-gradient(circle at 35% 30%,#d99b73,#a95631 58%,#64331e)}.nickel{width:62px;height:62px}.dime{width:46px;height:46px}.quarter{width:78px;height:78px}.half{width:96px;height:96px}.manhole{width:150px;height:150px;background:radial-gradient(circle,#777,#3a3a3a 58%,#151515);color:#ddd;font-size:12px;border-width:5px}.coin span{font-size:11px;letter-spacing:.04em}.quarter span{font-size:13px}.half span{font-size:13px}.arcade-restart{margin-top:20px;padding:13px 22px;border:1px solid #d8a927;background:#171207;color:#f3c94d;border-radius:7px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}@media(max-width:700px){.controls{padding:10px}.controls button{min-width:0;flex:1}.coins{gap:8px}.manhole{width:100px;height:100px}.half{width:78px;height:78px}.quarter{width:66px;height:66px}.nickel{width:54px;height:54px}.penny{width:46px;height:46px}.dime{width:40px;height:40px}}
  </style>
</head>
<body>
<div class="app">
  <main class="stage" aria-live="polite">
    <section class="frame active" data-frame="0"><img src="../assets/experiences/yellow-lion-onboarding/approved/01-parked.png" alt="Yellow Lion parked in its maintenance bay"></section>
    <section class="frame" data-frame="1"><img src="../assets/experiences/yellow-lion-onboarding/approved/02-cockpit-pilot-in.png" alt="View from inside the Yellow Lion cockpit in the maintenance hangar"></section>
    <section class="frame" data-frame="2"><img src="../assets/experiences/yellow-lion-onboarding/approved/03-sit.png" alt="Yellow Lion sitting"></section>
    <section class="frame" data-frame="3"><img src="../assets/experiences/yellow-lion-onboarding/approved/04-stand.png" alt="Yellow Lion standing"></section>
    <section class="frame" data-frame="4"><img src="../assets/experiences/yellow-lion-onboarding/approved/05-wind-up.png" alt="Yellow Lion baring its teeth in a mechanical smile"></section>
    <section class="frame" data-frame="5"><img src="../assets/experiences/yellow-lion-onboarding/approved/09-wind-up.png" alt="Yellow Lion crouched and holding back a powerful roar"></section>
    <section class="frame" data-frame="6"><img src="../assets/experiences/yellow-lion-onboarding/approved/06-roar.png" alt="Yellow Lion roaring with tremendous force"></section>
    <section class="frame" data-frame="7"><img src="../assets/experiences/yellow-lion-onboarding/approved/10-roar-shockwave.png" alt="Directional shockwave from Yellow Lion's roar flattening what lies ahead"></section>
    <section class="frame" data-frame="8"><img src="../assets/experiences/yellow-lion-onboarding/approved/11-critical-systems-failure.png" alt="Yellow Lion cockpit displaying critical systems failure alerts"></section>
    <section class="frame" data-frame="9"><img src="../assets/experiences/yellow-lion-onboarding/approved/12-post-failure-meow.png" alt="Yellow Lion standing uncertainly after the systems failure"></section>
    <section class="frame" data-frame="10"><img src="../assets/experiences/yellow-lion-onboarding/approved/07-splat.png" alt="Yellow Lion collapsed on the ground as people react around it"></section>
    <div id="question" class="question" aria-label="Question mark">?</div>
    <section id="arcade" class="arcade" aria-label="Insert 25 cents to continue">
      <h1>Insert 25 cents to continue</h1>
      <div id="timer" class="timer">30</div>
      <div id="tokenMessage" class="token-message"></div>
      <div class="coins" aria-label="Choose a token">
        <button class="coin penny" data-value="1"><span>PENNY</span></button>
        <button class="coin nickel" data-value="5"><span>NICKEL</span></button>
        <button class="coin dime" data-value="10"><span>DIME</span></button>
        <button class="coin quarter" data-value="25"><span>QUARTER</span></button>
        <button class="coin half" data-value="50"><span>HALF<br>DOLLAR</span></button>
        <button class="coin manhole" data-value="100000"><span>MANHOLE<br>COVER</span></button>
      </div>
    </section>
  </main>
  <div>
    <div class="controls" id="controls"></div>
    <div class="small">Participant controls action. System controls sequence.</div>
  </div>
</div>
<script>
const frames=[...document.querySelectorAll('.frame')];
const controls=document.getElementById('controls');
const question=document.getElementById('question');
const arcade=document.getElementById('arcade');
const timerEl=document.getElementById('timer');
const tokenMessage=document.getElementById('tokenMessage');
let state=0, countdown=null, seconds=30, acceptedToken=false;
function button(label,fn,className=''){
  const b=document.createElement('button'); b.textContent=label; if(className)b.className=className; b.addEventListener('click',fn); controls.appendChild(b);
}
function advance(){if(state<10){state++;render()}else if(state===10){showArcade()}}
function resetArcade(){if(countdown)clearInterval(countdown);countdown=null;seconds=30;acceptedToken=false;timerEl.textContent='30';tokenMessage.textContent='';arcade.classList.remove('active')}
function restart(){resetArcade();state=0;render()}
function showArcade(){
  frames.forEach(f=>f.classList.remove('active')); controls.innerHTML=''; question.classList.remove('show'); arcade.classList.add('active');
  seconds=30;acceptedToken=false;timerEl.textContent=seconds;tokenMessage.textContent='';
  if(countdown)clearInterval(countdown);
  countdown=setInterval(()=>{
    if(acceptedToken)return;
    seconds=Math.max(0,seconds-1);timerEl.textContent=seconds;
    if(seconds===0){clearInterval(countdown);countdown=null;tokenMessage.textContent='TIME EXPIRED.';const r=document.createElement('button');r.className='arcade-restart';r.textContent='Restart Training';r.addEventListener('click',restart);tokenMessage.appendChild(document.createElement('br'));tokenMessage.appendChild(r)}
  },1000)
}
function render(){
  resetArcade();frames.forEach((f,i)=>f.classList.toggle('active',i===state));controls.innerHTML='';question.classList.remove('show');
  if(state===0){button('Enter Cockpit',advance);return}
  if(state===1){button('Retreat',()=>question.classList.add('show'),'retreat');button('Attack Backward',advance);return}
  if(state===2){button('Stand',advance);return}
  if(state===3){button('Smile',advance);return}
  if(state===4){button('Wind Up',advance);return}
  if(state===5){button('3... 2... 1...',advance);return}
  if(state===6){button('Release',advance);return}
  if(state===7){button('Continue',advance);return}
  if(state===8){button('Continue',advance);return}
  if(state===9){button('MEOW',advance);return}
  if(state===10){button('GET UP! GET UP!',showArcade);return}
}
question.addEventListener('click',()=>question.classList.remove('show'));
document.querySelectorAll('.coin').forEach(c=>c.addEventListener('click',()=>{
  if(acceptedToken)return;
  const value=Number(c.dataset.value);
  if(value<25){tokenMessage.textContent='This token is too small.';return}
  if(value>25){tokenMessage.textContent='This token is too big.';return}
  acceptedToken=true;if(countdown)clearInterval(countdown);countdown=null;tokenMessage.textContent='This token is just right...';
  setTimeout(()=>{tokenMessage.textContent='However this feature is not implemented yet.';setTimeout(restart,2200)},1600)
}));
render();
</script>
</body>
</html>
